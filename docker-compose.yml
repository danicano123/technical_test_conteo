version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongo_db
    env_file:
      - .env
    volumes:
      - .:/app
    command: npm start

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./client:/app
    command: serve -s dist -l 5173

  mongo_db:
    image: mongo:6
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: